version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    # ASP.NET Core OpenApi 10 requires OpenAPI.NET 2.x. Upgrade these together.
    ignore:
      - dependency-name: Microsoft.OpenApi
        versions: [">=3.0.0"]
  - package-ecosystem: nuget
    directory: /server.Tests
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Microsoft.OpenApi
        versions: [">=3.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
